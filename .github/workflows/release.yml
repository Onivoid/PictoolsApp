name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v0.3.0)"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    CARGO_INCREMENTAL: 0
    CARGO_TERM_COLOR: always
    NO_STRIP: true
    APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS (arm64)
                      platform: macos-latest
                      rust-targets: aarch64-apple-darwin
                      args: "--target aarch64-apple-darwin"
                    - name: macOS (x86_64)
                      platform: macos-latest
                      rust-targets: x86_64-apple-darwin
                      args: "--target x86_64-apple-darwin"
                    - name: Linux (x86_64)
                      platform: ubuntu-22.04
                      args: "--bundles appimage,deb"
                    - name: Windows (x86_64)
                      platform: windows-latest
                      args: "--bundles nsis"

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - name: Install Linux dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file libfuse2

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: pnpm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust-targets }}

            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"
                  key: ${{ matrix.name }}

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ env.RELEASE_TAG }}
                  releaseName: Release ${{ env.RELEASE_TAG }}
                  releaseBody: See CHANGELOG.md for details
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}

    publish:
        name: Publish Release
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"

            - name: Generate and upload latest.json
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node scripts/updater.mjs ${{ env.RELEASE_TAG }}

            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "${{ env.RELEASE_TAG }}" --draft=false
